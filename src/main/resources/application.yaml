server:
  port: 8081

spring:
  application:
    name: filmoteka-media

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    io.github.mksfilmoteka.media: INFO
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"

media:
  root-location: uploads
  image:
    max-width: 300
    max-height: 450
    output-quality: 0.9
