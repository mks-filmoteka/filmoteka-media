server:
  port: 8081

spring:
  application:
    name: filmoteka-media

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI}
          jwk-set-uri: ${AUTH_JWK_SET_URI}
          audiences:
            - ${AUTH_AUDIENCE}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${KAFKA_MEDIA_CONSUMER_GROUP_ID}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  kafka:
    retry-delay: 1s
    topics:
      film-deleted:
        name: ${KAFKA_FILM_DELETED_TOPIC}
      film-poster-changed:
        name: ${KAFKA_FILM_POSTER_CHANGED_TOPIC}

logging:
  level:
    io.github.mksfilmoteka.media: INFO
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"

media:
  root-location: uploads
  image:
    max-width: 300
    max-height: 450
    output-quality: 0.9
